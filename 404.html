<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found — Dog Dad Boarding</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#3F4E28">
  <link rel="preconnect" href="https://fonts.bunny.net">
  <link rel="stylesheet" href="https://fonts.bunny.net/css?family=fraunces:400,400i,500,500i|nunito-sans:400,600,700&display=swap">
  <link rel="stylesheet" href="styles.css">
  <style>
    .not-found {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 48px 24px;
    }
    .not-found__paw {
      font-size: 4rem;
      margin-bottom: 24px;
    }
    .not-found h1 {
      color: var(--primary);
      margin-bottom: 16px;
    }
    .not-found p {
      color: var(--text-muted);
      font-size: 1.0625rem;
      max-width: 420px;
      margin-bottom: 36px;
    }
  </style>
</head>
<body>
  <main class="not-found">
    <div class="not-found__paw" aria-hidden="true">🐾</div>
    <h1>Pup Got Lost!</h1>
    <p>The page you're looking for doesn't exist — but your dog's perfect stay is just one click away.</p>
    <a href="/" class="btn btn--primary">Back to Home</a>
  </main>
</body>
</html>
